name: Process Standards Pipeline

on:
  push:
    paths:
      - 'raw/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild toan bo index'
        required: false
        default: 'false'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline
        run: |
          cd scripts
          python pipeline.py

      - name: Commit results
        run: |
          git config --global user.name "VIETSAFE Pipeline Bot"
          git config --global user.email "pipeline@vnsec.com.vn"
          git add data/
          git diff --staged --quiet || git commit -m "auto: cap nhat chunks va index [skip ci]"
          git push
