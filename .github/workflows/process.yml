name: Process PCCC Standards

on:
  workflow_dispatch:
  push:
    paths:
      - 'raw/**/*.md'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline
        run: |
          mkdir -p data/clean
          python3 scripts/pipeline.py

      # Không copy sang public/ — mọi thứ trong public/ được phục vụ tĩnh,
      # sẽ khiến toàn bộ corpus tải được mà không cần đăng nhập.
      # Webapp đọc trực tiếp data/chunks.jsonl phía server.

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: pipeline - $(date +%Y%m%d) - $(wc -l < data/chunks.jsonl) chunks"
          git pull --rebase origin main || true
          git push origin main
